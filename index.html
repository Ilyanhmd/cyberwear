<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERWEAR - Boutique Officielle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f11;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: #1a1a1e;
            border-bottom: 1px solid #333;
        }
        h1 {
            color: #00ffcc;
            margin: 0;
            font-size: 2.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .product-card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .price {
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .product-options {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .product-options select {
            background: #2a2a2e;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #00ccb3;
        }
        footer {
            text-align: center;
            padding: 30px 20px;
            background: #1a1a1e;
            border-top: 1px solid #333;
            margin-top: 60px;
            color: #aaa;
            font-size: 0.9rem;
        }
        footer a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>CYBERWEAR</h1>
        <p>Collection exclusive de t-shirts cyberpunk & streetwear</p>
    </header>

    <div class="container">
        <!-- Produit 1 : Le Mastodonte -->
        <div class="product-card">
            <div>
                <img src="t-shirt-le-mastodonte.jpg" alt="T-shirt Le Mastodonte">
                <h3>T-shirt Le Mastodonte</h3>
                <div class="price">20,00 €</div>
            </div>
            <div class="product-options">
                <select id="size-mastodonte">
                    <option value="S">S</option>
                    <option value="M" selected>M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
                <select id="qty-mastodonte">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <button onclick="acheter('mastodonte')">Acheter</button>
        </div>

        <!-- Produit 2 : Souverain des Enfers -->
        <div class="product-card">
            <div>
                <img src="t-shirt-le-souverain-des-enfers.jpg" alt="T-shirt Souverain des Enfers">
                <h3>T-shirt Souverain des Enfers</h3>
                <div class="price">20,00 €</div>
            </div>
            <div class="product-options">
                <select id="size-souverain-des-enfers">
                    <option value="S">S</option>
                    <option value="M" selected>M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
                <select id="qty-souverain-des-enfers">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <button onclick="acheter('souverain-des-enfers')">Acheter</button>
        </div>

        <!-- Produit 3 : L'Ange de la Mort -->
        <div class="product-card">
            <div>
                <img src="t-shirt-lange-de-la-mort.jpg" alt="T-shirt L'Ange de la Mort">
                <h3>T-shirt L'Ange de la Mort</h3>
                <div class="price">20,00 €</div>
            </div>
            <div class="product-options">
                <select id="size-ange-de-la-mort">
                    <option value="S">S</option>
                    <option value="M" selected>M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
                <select id="qty-ange-de-la-mort">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <button onclick="acheter('ange-de-la-mort')">Acheter</button>
        </div>

        <!-- Produit 4 : Cyborg -->
        <div class="product-card">
            <div>
                <img src="t-shirt-le-cyborg.jpg" alt="T-shirt Cyborg">
                <h3>T-shirt Cyborg</h3>
                <div class="price">20,00 €</div>
            </div>
            <div class="product-options">
                <select id="size-cyborg">
                    <option value="S">S</option>
                    <option value="M" selected>M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                </select>
                <select id="qty-cyborg">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <button onclick="acheter('cyborg')">Acheter</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CYBERWEAR. Tous droits réservés.</p>
        <p style="margin-top: 10px;">
            <a href="/mentions-legales.html">Mentions Légales</a> | 
            <a href="/cgv.html">CGV</a>
        </p>
    </footer>

    <script>
        async function acheter(productId) {
            const sizeSelect = document.getElementById(`size-${productId}`);
            const qtySelect = document.getElementById(`qty-${productId}`);

            const selectedSize = sizeSelect ? sizeSelect.value : 'M';
            const selectedQty = qtySelect ? parseInt(qtySelect.value) : 1;

            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        items: [{ id: productId, qty: selectedQty, size: selectedSize }]
                    })
                });

                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Erreur : ' + (data.error || 'Impossible de lancer le paiement'));
                }
            } catch (err) {
                console.error('Erreur réseau:', err);
                alert('Une erreur est survenue.');
            }
        }
    </script>

</body>
</html>
