<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERWEAR - Boutique Officielle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f11;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: #1a1a1e;
            border-bottom: 1px solid #333;
        }
        h1 {
            color: #00ffcc;
            margin: 0;
            font-size: 2.5rem;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #1a1a1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .product-card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #00ccb3;
        }
        footer {
            text-align: center;
            padding: 30px 20px;
            background: #1a1a1e;
            border-top: 1px solid #333;
            margin-top: 60px;
            color: #aaa;
            font-size: 0.9rem;
        }
        footer a {
            color: #00ffcc;
            text-decoration: none;
            margin: 0 10px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>CYBERWEAR</h1>
        <p>Collection exclusive de t-shirts cyberpunk & streetwear</p>
    </header>

    <div class="container">
        <!-- Produit 1 -->
        <div class="product-card">
            <h3>T-shirt Le Mastodonte</h3>
            <p>29,99 €</p>
            <button onclick="acheter('mastodonte')">Acheter</button>
        </div>

        <!-- Produit 2 -->
        <div class="product-card">
            <h3>T-shirt Souverain des Enfers</h3>
            <p>29,99 €</p>
            <button onclick="acheter('souverain-des-enfers')">Acheter</button>
        </div>

        <!-- Produit 3 -->
        <div class="product-card">
            <h3>T-shirt L'Ange de la Mort</h3>
            <p>29,99 €</p>
            <button onclick="acheter('ange-de-la-mort')">Acheter</button>
        </div>

        <!-- Produit 4 -->
        <div class="product-card">
            <h3>T-shirt Cyborg</h3>
            <p>29,99 €</p>
            <button onclick="acheter('cyborg')">Acheter</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CYBERWEAR. Tous droits réservés.</p>
        <p style="margin-top: 10px;">
            <a href="/mentions-legales.html">Mentions Légales</a> | 
            <a href="/cgv.html">CGV</a>
        </p>
    </footer>

    <script>
        // Fonction simple pour déclencher le paiement Stripe
        async function acheter(productId) {
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        items: [{ id: productId, qty: 1, size: 'M' }]
                    })
                });

                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Erreur : ' + (data.error || 'Impossible de lancer le paiement'));
                }
            } catch (err) {
                console.error('Erreur réseau:', err);
                alert('Une erreur est survenue.');
            }
        }
    </script>

</body>
</html>
